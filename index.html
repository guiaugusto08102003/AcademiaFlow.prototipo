<style>
  * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
  html, body { margin: 0; padding: 0; overscroll-behavior: none; }
  body {
    font-family: 'Inter', system-ui, sans-serif;
    background: #0a0a0a;
    color: #fff;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }
  .scrollbar-hide::-webkit-scrollbar { display: none; }
  .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }

  @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes pulse-glow { 0%, 100% { box-shadow: 0 0 15px rgba(191,255,0,0.3); } 50% { box-shadow: 0 0 30px rgba(191,255,0,0.6); } }
  @keyframes dropdownIn { from { opacity: 0; transform: translateY(-8px) scale(0.96); } to { opacity: 1; transform: translateY(0) scale(1); } }
  @keyframes overlayIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes toastIn { from { opacity: 0; transform: translate(-50%, -20px); } to { opacity: 1; transform: translate(-50%, 0); } }

  .animate-slide-up { animation: slideUp 0.4s ease-out both; }
  .animate-fade-in { animation: fadeIn 0.3s ease-out both; }
  .pulse-glow { animation: pulse-glow 2s ease-in-out infinite; }
  .animate-dropdown { animation: dropdownIn 0.2s ease-out both; }
  .animate-overlay { animation: overlayIn 0.15s ease-out both; }
  .animate-toast { animation: toastIn 0.25s cubic-bezier(0.16, 1, 0.3, 1) both; }

  .gradient-text {
    background: linear-gradient(135deg, #BFFF00 0%, #88cc00 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .glass {
    background: rgba(26, 26, 26, 0.75);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(255,255,255,0.07);
  }

  .card-hover { transition: transform 0.15s ease, border-color 0.2s ease; }
  .card-hover:hover { border-color: rgba(191,255,0,0.25); }
  .card-hover:active { transform: scale(0.98); }

  .bg-grid {
    background-image:
      linear-gradient(rgba(191,255,0,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(191,255,0,0.03) 1px, transparent 1px);
    background-size: 40px 40px;
  }

  .hero-gradient {
    background:
      radial-gradient(ellipse at top, rgba(191,255,0,0.15) 0%, transparent 50%),
      radial-gradient(ellipse at bottom right, rgba(191,255,0,0.08) 0%, transparent 50%),
      #0a0a0a;
  }

  input, textarea, select {
    background: #161616;
    border: 1px solid #2a2a2a;
    color: #fff;
    transition: all 0.2s;
    font-family: inherit;
  }
  input:focus, textarea:focus, select:focus {
    outline: none;
    border-color: #BFFF00;
    box-shadow: 0 0 0 3px rgba(191,255,0,0.12);
  }

  .tab-active { color: #BFFF00 !important; }
  .tab-active::after {
    content: '';
    position: absolute;
    bottom: -4px;
    left: 50%;
    transform: translateX(-50%);
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: #BFFF00;
  }

  .tab-btn { position: relative; }

  .safe-bottom { padding-bottom: env(safe-area-inset-bottom, 0px); }
  .safe-top { padding-top: env(safe-area-inset-top, 0px); }

  button { font-family: inherit; cursor: pointer; }

  .menu-item { transition: background 0.15s ease; }
  .menu-item:hover { background: rgba(255,255,255,0.05); }
  .menu-item:active { background: rgba(255,255,255,0.09); }

  .avatar-btn { transition: all 0.2s ease; position: relative; }
  .avatar-btn:hover { transform: scale(1.05); }
  .avatar-btn.active { box-shadow: 0 0 0 2px #BFFF00; }

  /* Desktop app shell feel */
  @media (min-width: 640px) {
    body {
      background: #050505;
      background-image: radial-gradient(circle at 50% 0%, rgba(191,255,0,0.06) 0%, transparent 60%);
    }
    .app-shell {
      max-width: 480px;

      border-right: 1px solid rgba(255,255,255,0.06);

      position: relative;
    }
    .fixed-shell-bar {
      max-width: 478px;
      margin: 0 auto;
    }

  data: JSON.parse(JSON.stringify(DEFAULT_DATA))
};

// Load full state from localStorage
try {
  const saved = localStorage.getItem('academiaflow_v2_data');
  if (saved) {
    const parsed = JSON.parse(saved);
    state.data = { ...JSON.parse(JSON.stringify(DEFAULT_DATA)), ...parsed };
  }
  const savedUser = localStorage.getItem('academiaflow_v2_user');
  if (savedUser) {
    const u = JSON.parse(savedUser);
    const freshUser = state.data.users.find(x => x.id === u.id) || u;
    state.user = freshUser;
    state.currentView = 'dashboard';
  }
} catch(e) { console.error('Load error:', e); }

function saveData() {
  try {
    localStorage.setItem('academiaflow_v2_data', JSON.stringify(state.data));
  } catch(e) {}
}

function saveUser() {
  try {
    if (state.user) localStorage.setItem('academiaflow_v2_user', JSON.stringify(state.user));
    else localStorage.removeItem('academiaflow_v2_user');
  } catch(e) {}
}

// ============ TOAST NOTIFICATION ============
let toastTimeout = null;
function showToast(message, type = 'success') {
  const container = document.getElementById('toast-container');
  if (!container) return;
  const colors = {
    success: 'border-[#BFFF00]/40 text-[#BFFF00]',
    error: 'border-red-500/40 text-red-400',
    info: 'border-blue-400/40 text-blue-300'
  };
  const icon = type === 'success' ? '✓' : type === 'error' ? '✕' : 'ℹ';
  container.innerHTML = `
    <div class="fixed top-5 left-1/2 -translate-x-1/2 z-[100] glass px-4 py-3 rounded-2xl shadow-2xl flex items-center gap-2.5 text-xs font-semibold animate-toast border ${colors[type] || colors.success}" style="max-width:90vw">
      <span class="w-5 h-5 rounded-full flex items-center justify-center bg-white/10 font-bold">${icon}</span>
      <span class="text-white">${message}</span>
    </div>
  `;
  if (toastTimeout) clearTimeout(toastTimeout);
  toastTimeout = setTimeout(() => {
    container.innerHTML = '';
  }, 3000);
}

  try {
    const app = document.getElementById('app');
    if (!app) return;
    switch(state.currentView) {
      case 'login': app.innerHTML = renderLogin(); break;
      case 'dashboard': app.innerHTML = renderDashboard(); break;
      case 'workout': app.innerHTML = renderWorkoutView(); break;
      case 'workout-mode': app.innerHTML = renderWorkoutMode(); break;
      default: app.innerHTML = renderLogin();
    }
    renderModal();
    attachEvents();
  } catch(e) {
    console.error('Render error:', e);
    document.getElementById('app').innerHTML = `<div style="padding:20px;color:red">Erro: ${e.message}</div>`;
  }
}

function generateQRData() {
  let rects = '';
  const seed = state.user.id.charCodeAt(0) + (state.qrSeed % 97);
  for (let row = 0; row < 20; row++) {
    for (let col = 0; col < 20; col++) {
      if ((row < 7 && col < 7) || (row < 7 && col > 12) || (row > 12 && col < 7)) continue;
      if (((row * 7 + col * 13 + seed) % 3) === 0) {
        rects += `<rect x="${5 + col * 4.5}" y="${5 + row * 4.5}" width="4" height="4" fill="black"/>`;
      }
    }
  }
  return rects;
}

function renderWorkoutMode() {
  const workout = state.data.workouts.find(w => w.student_id === state.user.id) || state.data.workouts[0];

  const totalSets = workout.exercises_json.reduce((s, e) => s + e.sets, 0);
  const completedSets = workout.exercises_json.reduce((s, e, idx) => {
    const key = `${workout.id}_${idx}`;
    return s + (state.data.completed_sets[key] || 0);
  }, 0);
  const progress = Math.round((completedSets / totalSets) * 100);

  return `
    <div class="min-h-screen bg-grid pb-10" style="background-color:#0a0a0a">

      ${state.restTimer.active ? `
        <div class="mx-5 mt-4 glass rounded-2xl p-4 border border-[#BFFF00]/40 flex items-center justify-between animate-fade-in">
          <div>
            <div class="text-[10px] uppercase tracking-wider text-[#BFFF00] font-bold">Descanso ativo</div>
            <div id="rest-timer-val" class="text-2xl font-bold font-mono">${state.restTimer.seconds}s</div>

          <div class="flex gap-2">

          </div>
        </div>
      ` : ''}

      <div class="px-5 py-4">
        <div class="text-center mb-5">
          <div class="text-5xl font-bold gradient-text mb-1">${progress}%</div>
          <div class="text-xs text-gray-500">${completedSets} de ${totalSets} séries concluídas</div>
        </div>

        <div class="space-y-3">
          ${workout.exercises_json.map((ex, idx) => {
            const key = `${workout.id}_${idx}`;
            const completed = state.data.completed_sets[key] || 0;
            const isCurrent = completed < ex.sets && (idx === 0 || (state.data.completed_sets[`${workout.id}_${idx-1}`] || 0) === workout.exercises_json[idx-1].sets);
            const isDone = completed === ex.sets;
            return `
              <div class="glass rounded-2xl p-4 ${isCurrent ? 'ring-2' : ''}" style="${isCurrent ? 'border-color:#BFFF00' : ''} ${isDone ? 'opacity:0.6' : ''}">
                <div class="flex items-start gap-3 mb-3">
                  <div class="w-8 h-8 rounded-lg flex items-center justify-center font-bold text-sm flex-shrink-0" style="background:${isDone ? '#4ade80' : (isCurrent ? '#BFFF00' : '#1a1a1a')};color:${isDone || isCurrent ? '#0a0a0a' : '#6b7280'}">

// ============ EVENTS ============
function attachEvents() {
  // Auth Tabs
  document.querySelectorAll('[data-auth-tab]').forEach(btn => {
    btn.onclick = () => {
      state.authTab = btn.dataset.authTab;
      render();
    };
  });

  // Login
  const btnLogin = document.getElementById('btn-login');
  if (btnLogin) {
    btnLogin.onclick = () => {
      const email = document.getElementById('login-email').value.trim().toLowerCase();
      const user = state.data.users.find(u => u.email.toLowerCase() === email);
      if (user) {
        state.user = user;
        state.currentView = 'dashboard';
        state.activeTab = 'home';
        state.showUserMenu = false;
        saveUser();
        showToast(`Bem-vindo, ${user.name.split(' ')[0]}!`);
        render();
      } else {
        showToast('Usuário não encontrado. Crie uma conta ou use o acesso rápido.', 'error');
      }
    };
  }

  // Register
  const btnReg = document.getElementById('btn-register');
  if (btnReg) {
    btnReg.onclick = () => {
      const name = document.getElementById('reg-name').value.trim();
      const email = document.getElementById('reg-email').value.trim().toLowerCase();
      const role = document.getElementById('reg-role').value;
      if (!name || !email) {
        showToast('Preencha nome e e-mail.', 'error');
        return;
      }
      if (state.data.users.some(u => u.email.toLowerCase() === email)) {
        showToast('Este e-mail já está cadastrado.', 'error');
        return;
      }
      const newUser = {
        id: 'u' + Date.now(),
        tenant_id: 't1',
        role,
        name,
        phone: '+5511999990000',
        email,
        access_status: 'ACTIVE'
      };
      state.data.users.push(newUser);
      if (role === 'STUDENT') {
        state.data.subscriptions.push({
          id: 's' + Date.now(),
          tenant_id: 't1',
          user_id: newUser.id,
          status: 'active',
          due_date: '2026-12-23',
          amount: 99.90
        });
      }
      saveData();
      state.user = newUser;
      state.currentView = 'dashboard';
      state.activeTab = 'home';
      saveUser();
      showToast('Conta criada com sucesso!');
      render();
    };
  }

  // Quick login
  document.querySelectorAll('.quick-login').forEach(btn => {
    btn.onclick = () => {
      const role = btn.dataset.role;

        state.user = user;
        state.currentView = 'dashboard';
        state.activeTab = 'home';
        state.showUserMenu = false;
        saveUser();
        showToast(`Entrou como ${user.name}`);
        render();
      }
    };

  if (btnBell) {
    btnBell.onclick = () => {
      const overdue = state.data.subscriptions.filter(s => s.status === 'overdue').length;
      showToast(overdue > 0 ? `${overdue} aluno(s) com mensalidade pendente.` : 'Nenhuma pendência no momento.', 'info');
    };
  }

  const btnAvatar = document.getElementById('btn-avatar');
  if (btnAvatar) {
    btnAvatar.onclick = (e) => {
      e.stopPropagation();
      state.showUserMenu = !state.showUserMenu;
      render();
    };
  }

  const menuOverlay = document.getElementById('menu-overlay');
  if (menuOverlay) {
    menuOverlay.onclick = () => {
      state.showUserMenu = false;
      render();
    };
  }

  // Menu: Profile
  const menuProfile = document.getElementById('menu-profile');
  if (menuProfile) {
    menuProfile.onclick = () => {
      state.showUserMenu = false;
      state.modal = { type: 'profile' };
      render();
    };
  }

  // Menu: Switch Account
  const menuSwitch = document.getElementById('menu-switch-account');
  if (menuSwitch) {
    menuSwitch.onclick = () => {
      state.showUserMenu = false;
      state.user = null;
      state.currentView = 'login';
      state.activeTab = 'home';
      state.editingWorkout = null;
      saveUser();
      render();
    };

  const menuLogout = document.getElementById('menu-logout');
  if (menuLogout) {
    menuLogout.onclick = () => {
      state.showUserMenu = false;
      state.modal = { type: 'confirm-logout' };
      render();
    };

  // Modal controls
  const closeModal = () => { state.modal = null; render(); };
  const elClose1 = document.getElementById('close-modal');
  const elClose2 = document.getElementById('close-modal-btn');
  const elBackdrop = document.getElementById('modal-backdrop');
  if (elClose1) elClose1.onclick = closeModal;
  if (elClose2) elClose2.onclick = closeModal;
  if (elBackdrop) elBackdrop.onclick = closeModal;

  const confirmLogoutBtn = document.getElementById('confirm-logout-btn');
  if (confirmLogoutBtn) {
    confirmLogoutBtn.onclick = () => {
      state.modal = null;
      state.user = null;
      state.currentView = 'login';
      state.activeTab = 'home';
      state.editingWorkout = null;
      saveUser();
      showToast('Sessão encerrada.', 'info');
      render();
    };
  }

  // Add Student Modal
  const btnOpenAddStudent = document.getElementById('btn-open-add-student');
  if (btnOpenAddStudent) {
    btnOpenAddStudent.onclick = () => {
      state.modal = { type: 'add-student' };
      render();
    };
  }

  const btnSaveNewStudent = document.getElementById('save-new-student');
  if (btnSaveNewStudent) {
    btnSaveNewStudent.onclick = () => {
      const name = document.getElementById('new-st-name').value.trim();
      const email = document.getElementById('new-st-email').value.trim();
      const phone = document.getElementById('new-st-phone').value.trim() || '+5511999990000';
      const amount = parseFloat(document.getElementById('new-st-amount').value) || 99.90;
      if (!name || !email) {
        showToast('Preencha nome e e-mail do aluno.', 'error');
        return;
      }
      const id = 'u' + Date.now();
      state.data.users.push({
        id, tenant_id: 't1', role: 'STUDENT', name, phone, email, access_status: 'ACTIVE'
      });
      state.data.subscriptions.push({
        id: 's' + Date.now(), tenant_id: 't1', user_id: id, status: 'active', due_date: '2026-12-23', amount
      });
      saveData();
      state.modal = null;
      showToast(`Aluno ${name} cadastrado!`);
      render();
    };
  }

  // Student search & filter
  const searchInput = document.getElementById('student-search-input');
  if (searchInput) {
    searchInput.oninput = (e) => {
      state.studentSearch = e.target.value;
      const pos = e.target.selectionStart;
      render();
      const el = document.getElementById('student-search-input');
      if (el) { el.focus(); el.setSelectionRange(pos, pos); }

  document.querySelectorAll('[data-st-filter]').forEach(btn => {

      state.studentFilter = btn.dataset.stFilter;
      render();

  });

  // Toggle student status (Active/Blocked)
  document.querySelectorAll('[data-toggle-status]').forEach(btn => {

      const id = btn.dataset.toggleStatus;
      const st = state.data.users.find(u => u.id === id);
      const sub = state.data.subscriptions.find(s => s.user_id === id);
      if (st) {
        const nextActive = st.access_status !== 'ACTIVE';
        st.access_status = nextActive ? 'ACTIVE' : 'BLOCKED';
        if (sub) sub.status = nextActive ? 'active' : 'overdue';
        saveData();
        showToast(`${st.name}: acesso ${nextActive ? 'LIBERADO' : 'BLOQUEADO'}`, nextActive ? 'success' : 'error');
        render();
      }
    };
  });

  // Turnstile Simulator
  const btnSimGate = document.getElementById('btn-sim-gate');
  if (btnSimGate) {
    btnSimGate.onclick = () => {
      const userId = document.getElementById('sim-student-select').value;
      const st = state.data.users.find(u => u.id === userId);
      if (!st) return;
      const granted = st.access_status === 'ACTIVE';
      state.data.access_logs.push({
        id: 'a' + Date.now(),
        tenant_id: 't1',
        user_id: userId,
        method: 'QR',
        status: granted ? 'GRANTED' : 'DENIED',
        timestamp: new Date().toISOString()
      });
      saveData();
      showToast(granted ? `Catraca liberada para ${st.name}!` : `Acesso negado para ${st.name}!`, granted ? 'success' : 'error');
      render();
    };
  }

  // Student Regularize payment
  const btnRegularize = document.getElementById('btn-regularize');
  if (btnRegularize) {
    btnRegularize.onclick = () => {
      const u = state.data.users.find(x => x.id === state.user.id);
      const sub = state.data.subscriptions.find(s => s.user_id === state.user.id);
      if (u) u.access_status = 'ACTIVE';
      if (sub) { sub.status = 'active'; sub.due_date = '2026-12-23'; }
      state.user.access_status = 'ACTIVE';
      saveData();
      saveUser();
      showToast('Pagamento confirmado! Catraca liberada.');
      render();
    };
  }

  // Refresh QR
  const btnRefreshQR = document.getElementById('btn-refresh-qr');
  if (btnRefreshQR) {
    btnRefreshQR.onclick = () => {
      state.qrSeed = Date.now();
      showToast('Novo token QR gerado!', 'info');
      render();
    };
  }

  // Install PWA
  const btnInstallPWA = document.getElementById('btn-install-pwa');
  if (btnInstallPWA && state.deferredInstallPrompt) {
    btnInstallPWA.onclick = async () => {
      state.deferredInstallPrompt.prompt();
      const { outcome } = await state.deferredInstallPrompt.userChoice;
      if (outcome === 'accepted') state.deferredInstallPrompt = null;
      render();
    };
  }

  // Reset Demo
  const btnResetDemo = document.getElementById('btn-reset-demo');
  if (btnResetDemo) {
    btnResetDemo.onclick = () => {
      localStorage.removeItem('academiaflow_v2_data');
      state.data = JSON.parse(JSON.stringify(DEFAULT_DATA));
      showToast('Dados da demonstração restaurados!', 'info');
      render();
    };
  }

  // Tabs
  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.onclick = () => {
      const tab = btn.dataset.tab;
      if (tab) {
        state.activeTab = tab;
        state.showUserMenu = false;
        render();
      }
    };
  });

  // Student cards (Trainer)
  document.querySelectorAll('.student-card').forEach(btn => {
    btn.onclick = () => {
      const studentId = btn.dataset.student;
      const workout = state.data.workouts.find(w => w.student_id === studentId);
      state.editingWorkout = workout ? { ...workout, exercises_json: workout.exercises_json.map(e => ({...e})) } : { student_id: studentId, title: '', exercises_json: [] };
      state.currentView = 'workout';
      render();
    };
  });

  // New workout
  document.querySelectorAll('[data-action="new-workout"]').forEach(btn => {
    btn.onclick = () => {
      state.editingWorkout = { title: '', exercises_json: [] };
      state.currentView = 'workout';
      render();
    };
  });

  // Edit workout
  document.querySelectorAll('[data-edit-workout]').forEach(btn => {
    btn.onclick = () => {
      const id = btn.dataset.editWorkout;
      const w = state.data.workouts.find(w => w.id === id);
      state.editingWorkout = { ...w, exercises_json: w.exercises_json.map(e => ({...e})) };
      state.currentView = 'workout';
      render();
    };
  });

  // Delete workout
  document.querySelectorAll('[data-delete-workout]').forEach(btn => {
    btn.onclick = () => {
      const id = btn.dataset.deleteWorkout;
      state.data.workouts = state.data.workouts.filter(w => w.id !== id);
      saveData();
      showToast('Ficha removida.', 'info');
      render();
    };
  });

  // Back
  const btnBack = document.getElementById('btn-back');
  if (btnBack) {
    btnBack.onclick = () => {
      state.currentView = 'dashboard';
      state.editingWorkout = null;
      render();
    };
  }

  // Add exercise
  const btnAddEx = document.getElementById('btn-add-exercise');
  if (btnAddEx) {
    btnAddEx.onclick = () => {
      state.editingWorkout.exercises_json.push({ name: '', sets: 3, reps: '10-12', load: '', rest: '60s', notes: '' });
      render();
    };
  }

  // Remove exercise
  document.querySelectorAll('[data-remove-exercise]').forEach(btn => {
    btn.onclick = () => {
      const idx = parseInt(btn.dataset.removeExercise);
      state.editingWorkout.exercises_json.splice(idx, 1);
      render();
    };
  });

  // Exercise fields
  document.querySelectorAll('.ex-field').forEach(input => {
    input.oninput = () => {
      const card = input.closest('[data-exercise-idx]');
      if (!card) return;
      const idx = parseInt(card.dataset.exerciseIdx);
      const field = input.dataset.field;
      state.editingWorkout.exercises_json[idx][field] = field === 'sets' ? (parseInt(input.value) || 0) : input.value;
    };
  });

  // Save workout
  const btnSave = document.getElementById('btn-save-workout');
  if (btnSave) {
    btnSave.onclick = () => {
      const studentId = document.getElementById('f-student').value;
      const title = document.getElementById('f-title').value.trim();
      if (!studentId || !title) {
        showToast('Preencha aluno e título da ficha.', 'error');
        return;
      }
      if (state.editingWorkout.exercises_json.length === 0) {
        showToast('Adicione pelo menos um exercício.', 'error');
        return;
      }

      if (state.editingWorkout.id) {
        const idx = state.data.workouts.findIndex(w => w.id === state.editingWorkout.id);
        state.data.workouts[idx] = {
          ...state.editingWorkout,
          student_id: studentId,
          title: title,
          updated_at: new Date().toISOString().split('T')[0]
        };
      } else {
        state.data.workouts.push({
          id: 'w' + Date.now(),
          tenant_id: 't1',
          student_id: studentId,
          trainer_id: state.user.id,
          title: title,
          exercises_json: state.editingWorkout.exercises_json,
          updated_at: new Date().toISOString().split('T')[0]
        });
      }
      saveData();
      state.currentView = 'dashboard';
      state.activeTab = 'workouts';
      state.editingWorkout = null;
      showToast('Ficha de treino salva!');
      render();
    };
  }

  // Start workout
  const btnStart = document.getElementById('btn-start-workout');
  if (btnStart) {
    btnStart.onclick = () => {
      state.currentView = 'workout-mode';
      render();
      startWorkoutTimer();
      requestWakeLock();
    };
  }

  // Exit workout mode
  const btnExit = document.getElementById('btn-exit-mode');
  if (btnExit) {
    btnExit.onclick = () => {
      state.currentView = 'dashboard';
      state.activeTab = 'workout';
      stopWorkoutTimer();
      stopRestTimer();
      releaseWakeLock();
      render();
    };
  }

  // Finish workout
  const btnFinish = document.getElementById('btn-finish-workout');
  if (btnFinish) {
    btnFinish.onclick = () => {
      const workout = state.data.workouts.find(w => w.student_id === state.user.id) || state.data.workouts[0];
      if (workout) {
        workout.exercises_json.forEach((_, idx) => {
          delete state.data.completed_sets[`${workout.id}_${idx}`];
        });
      }
      state.data.workout_history[state.user.id] = (state.data.workout_history[state.user.id] || 12) + 1;
      saveData();
      state.currentView = 'dashboard';
      state.activeTab = 'home';
      stopWorkoutTimer();
      stopRestTimer();
      releaseWakeLock();
      showToast('Treino registrado no seu histórico! 🏆');
      render();
    };
  }

  // Rest timer controls
  const btnSkipRest = document.getElementById('btn-skip-rest');
  if (btnSkipRest) btnSkipRest.onclick = () => { stopRestTimer(); render(); };
  const btnAddRest = document.getElementById('btn-add-rest');
  if (btnAddRest) btnAddRest.onclick = () => { state.restTimer.seconds += 15; render(); };

  // Set buttons
  document.querySelectorAll('.set-btn').forEach(btn => {
    btn.onclick = () => {
      const key = btn.dataset.set;
      const restSec = parseInt(btn.dataset.rest) || 60;
      const parts = key.split('_');
      const wId = parts[0];
      const exIdx = parseInt(parts[1]);
      const sIdx = parseInt(parts[2]);

      const workout = state.data.workouts.find(w => w.id === wId);
      if (!workout) return;

      const currentKey = `${wId}_${exIdx}`;
      const current = state.data.completed_sets[currentKey] || 0;

      if (sIdx === current) {
        state.data.completed_sets[currentKey] = current + 1;
        if (navigator.vibrate) navigator.vibrate(30);
        if (state.currentView === 'workout-mode') startRestTimer(restSec);
      } else if (sIdx < current) {
        state.data.completed_sets[currentKey] = sIdx;
      }

      saveData();
      render();
      if (state.currentView === 'workout-mode') startWorkoutTimer();
    };
  });

  // QR Timer
  if (state.activeTab === 'qr' && state.user && state.user.role === 'STUDENT') {
    startQRTimer();
  }
}

// Close menu on outside click
document.addEventListener('click', (e) => {
  if (state.showUserMenu) {
    const menu = document.getElementById('user-menu');
    const avatar = document.getElementById('btn-avatar');
    if (menu && !menu.contains(e.target) && (!avatar || !avatar.contains(e.target))) {
      state.showUserMenu = false;
      render();
    }
  }
});

// ============ TIMERS ============
let workoutTimerInterval = null;
let workoutStartTime = null;

function startWorkoutTimer() {
  if (workoutTimerInterval) clearInterval(workoutTimerInterval);
  if (!workoutStartTime) workoutStartTime = Date.now();

  workoutTimerInterval = setInterval(() => {
    const elapsed = Math.floor((Date.now() - workoutStartTime) / 1000);
    const mins = Math.floor(elapsed / 60).toString().padStart(2, '0');
    const secs = (elapsed % 60).toString().padStart(2, '0');
    const timerEl = document.getElementById('timer');
    if (timerEl) timerEl.textContent = `${mins}:${secs}`;
  }, 1000);
}

function stopWorkoutTimer() {
  if (workoutTimerInterval) {
    clearInterval(workoutTimerInterval);
    workoutTimerInterval = null;
  }
  workoutStartTime = null;
}

let restTimerInterval = null;
function startRestTimer(seconds) {
  stopRestTimer();
  state.restTimer = { active: true, seconds, total: seconds };
  restTimerInterval = setInterval(() => {
    state.restTimer.seconds--;
    const el = document.getElementById('rest-timer-val');
    if (el) el.textContent = `${state.restTimer.seconds}s`;
    if (state.restTimer.seconds <= 0) {
      stopRestTimer();
      if (navigator.vibrate) navigator.vibrate([100, 50, 100]);
      showToast('Descanso finalizado! Próxima série 💪', 'info');
      render();
    }
  }, 1000);
}

function stopRestTimer() {
  if (restTimerInterval) {
    clearInterval(restTimerInterval);
    restTimerInterval = null;
  }
  state.restTimer.active = false;
}

let qrTimerInterval = null;
function startQRTimer() {
  if (qrTimerInterval) clearInterval(qrTimerInterval);
  let seconds = 60;
  const update = () => {
    const el = document.getElementById('qr-timer');
    if (!el) { clearInterval(qrTimerInterval); qrTimerInterval = null; return; }
    const mins = Math.floor(seconds / 60).toString().padStart(2, '0');
    const secs = (seconds % 60).toString().padStart(2, '0');
    el.textContent = `${mins}:${secs}`;
    seconds--;
    if (seconds < 0) {
      seconds = 60;
      state.qrSeed = Date.now();
      render();
    }
  };
  update();
  qrTimerInterval = setInterval(update, 1000);
}

// ============ WAKE LOCK & PWA ============
let wakeLock = null;
async function requestWakeLock() {
  try {
    if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen');
  } catch (e) {}
}
async function releaseWakeLock() {
  if (wakeLock) {
    try { await wakeLock.release(); } catch(e) {}
    wakeLock = null;
  }
}

window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  state.deferredInstallPrompt = e;
});

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/sw.js').catch(() => {});
  });
}

// ============ INIT ============
render();

document.addEventListener('visibilitychange', () => {
  if (state.currentView === 'workout-mode' && document.visibilityState === 'visible') {
    requestWakeLock();
  }
});
</script>
</body>
</html>
